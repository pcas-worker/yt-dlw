<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Converter & Downloader (Cobalt API)</title>
  
  <!-- Evita erro 404 do favicon -->
  <link rel="icon" href="data:,">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #02150f 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(2, 44, 34, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

  <!-- CABEÇALHO / HEADER -->
  <header class="border-b border-emerald-900/50 bg-emerald-950/70 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-emerald-600 p-2 rounded-xl text-white shadow-lg shadow-emerald-600/40">
          <i data-lucide="download"></i>
        </div>
        <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">
          MediaFetch Pro
        </span>
      </div>
      <div class="flex items-center gap-2 text-sm text-emerald-200">
        <span class="inline-flex items-center gap-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-semibold shadow-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Railway API Ativa
        </span>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-3xl mx-auto px-4 py-12 flex-1 w-full">
    
    <!-- TÍTULO PRINCIPAL -->
    <div class="text-center mb-8">
      <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-3">
        Baixar Vídeos e Músicas do <span class="bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">YouTube</span>
      </h1>
      <p class="text-emerald-200 text-sm md:text-base max-w-lg mx-auto">
        Converta conteúdos do YouTube para MP3 de alta qualidade ou MP4 HD em segundos. Grátis e sem anúncios.
      </p>
    </div>

    <!-- PAINEL CONVERSOR -->
    <div class="glass-card rounded-2xl p-6 md:p-8">
      
      <!-- INPUT DE URL -->
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-400">
            <i data-lucide="link"></i>
          </div>
          <input 
            type="text" 
            id="url-input" 
            placeholder="Cole o link do vídeo aqui (ex: https://youtu.be/...)"
            class="w-full pl-10 pr-4 py-3.5 bg-emerald-950/80 border border-emerald-800/80 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 text-white placeholder-emerald-400/60 transition shadow-inner"
          >
        </div>
        <button 
          id="fetch-btn" 
          onclick="detectarVideo()"
          class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3.5 rounded-xl font-medium flex items-center justify-center gap-2 transition active:scale-95 shadow-lg shadow-emerald-600/30"
        >
          <i data-lucide="search" class="w-4 h-4"></i>
          <span>Analisar</span>
        </button>
      </div>

      <!-- ÁREA DE SELEÇÃO DE FORMATOS & PRÉVIA -->
      <div id="media-card" class="hidden space-y-6 pt-4 border-t border-emerald-900/60">
        
        <!-- PRÉVIA DO VÍDEO -->
        <div class="flex flex-col sm:flex-row gap-4 items-center bg-emerald-950/60 p-4 rounded-xl border border-emerald-900/80 shadow-inner">
          <img id="thumb-preview" src="" alt="Thumbnail" class="w-full sm:w-40 aspect-video object-cover rounded-lg border border-emerald-800/50">
          <div class="flex-1 text-center sm:text-left overflow-hidden">
            <h3 id="video-title" class="font-semibold text-emerald-100 truncate text-base">Título do Vídeo</h3>
            <p class="text-xs text-emerald-400 mt-1 flex items-center justify-center sm:justify-start gap-1">
              <i data-lucide="video" class="w-3.5 h-3.5 text-emerald-400"></i> YouTube
            </p>
          </div>
        </div>

        <!-- ABAS DE FORMATO (MP4 / MP3) -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-300 mb-2">Formato de Saída</label>
          <div class="grid grid-cols-2 gap-3">
            <button 
              id="tab-mp4"
              onclick="selecionarFormato('mp4')"
              class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium text-sm transition border border-emerald-500 bg-emerald-600/30 text-emerald-200 shadow-sm"
            >
              <i data-lucide="video" class="w-4 h-4"></i>
              Vídeo (MP4)
            </button>
            <button 
              id="tab-mp3"
              onclick="selecionarFormato('mp3')"
              class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium text-sm transition border border-emerald-950 bg-emerald-950/50 text-emerald-400/80 hover:border-emerald-800 shadow-sm"
            >
              <i data-lucide="music" class="w-4 h-4"></i>
              Áudio (MP3)
            </button>
          </div>
        </div>

        <!-- OPÇÕES DE QUALIDADE -->
        <div id="quality-wrapper">
          <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-300 mb-2">Qualidade do Vídeo</label>
          <select id="quality-select" class="w-full bg-emerald-950/80 border border-emerald-800/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 shadow-inner">
            <option value="1080" class="bg-emerald-950 text-white">1080p</option>
            <option value="720" class="bg-emerald-950 text-white">720p HD</option>
            <option value="480" class="bg-emerald-950 text-white">480p</option>
            <option value="360" class="bg-emerald-950 text-white">360p</option>
          </select>
        </div>

        <!-- MENSAGEM DE ERRO OU ALERTA -->
        <div id="error-alert" class="hidden p-3.5 bg-red-950/80 border border-red-800/80 text-red-200 rounded-xl text-sm flex items-center gap-2 shadow-sm">
          <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-red-400"></i>
          <span id="error-msg">Não foi possível processar este link.</span>
        </div>

        <!-- BOTÃO PRINCIPAL DE DOWNLOAD -->
        <button 
          id="download-btn" 
          onclick="iniciarDownload()"
          class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/40 transition active:scale-[0.99] flex items-center justify-center gap-2 disabled:opacity-50"
        >
          <i data-lucide="download" class="w-5 h-5"></i>
          <span id="btn-text">Baixar Agora</span>
        </button>

      </div>

    </div>

  </main>

  <!-- RODAPÉ -->
  <footer class="border-t border-emerald-900/40 bg-emerald-950/60 py-6 text-center text-xs text-emerald-400/80">
    <p>Powered by Railway & Cobalt API • Instância Privada</p>
  </footer>

  <!-- LÓGICA EM JAVASCRIPT -->
  <script>
    lucide.createIcons();

    let formatoAtual = 'mp4';
    let videoUrl = '';

    function extrairIDYouTube(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function detectarVideo() {
      const input = document.getElementById('url-input').value.trim();
      const errorAlert = document.getElementById('error-alert');
      errorAlert.classList.add('hidden');

      if (!input) {
        exibirErro("Insira um link do YouTube válido.");
        return;
      }

      const id = extrairIDYouTube(input);
      if (!id) {
        exibirErro("Não foi possível identificar o ID do vídeo. Verifique a URL.");
        return;
      }

      videoUrl = input;
      document.getElementById('thumb-preview').src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
      document.getElementById('video-title').innerText = `Vídeo ID: ${id}`;
      document.getElementById('media-card').classList.remove('hidden');
    }

    function selecionarFormato(formato) {
      formatoAtual = formato;
      const tabMp4 = document.getElementById('tab-mp4');
      const tabMp3 = document.getElementById('tab-mp3');
      const qualityWrapper = document.getElementById('quality-wrapper');

      if (formato === 'mp4') {
        tabMp4.className = "flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium text-sm transition border border-emerald-500 bg-emerald-600/30 text-emerald-200 shadow-sm";
        tabMp3.className = "flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium text-sm transition border border-emerald-950 bg-emerald-950/50 text-emerald-400/80 hover:border-emerald-800 shadow-sm";
        qualityWrapper.classList.remove('hidden');
      } else {
        tabMp3.className = "flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium text-sm transition border border-emerald-500 bg-emerald-600/30 text-emerald-200 shadow-sm";
        tabMp4.className = "flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium text-sm transition border border-emerald-950 bg-emerald-950/50 text-emerald-400/80 hover:border-emerald-800 shadow-sm";
        qualityWrapper.classList.add('hidden');
      }
    }

    function exibirErro(msg) {
      const errorAlert = document.getElementById('error-alert');
      const errorMsg = document.getElementById('error-msg');
      errorMsg.innerText = msg;
      errorAlert.classList.remove('hidden');
    }

    async function iniciarDownload() {
      const btn = document.getElementById('download-btn');
      const btnText = document.getElementById('btn-text');
      const errorAlert = document.getElementById('error-alert');

      errorAlert.classList.add('hidden');
      btn.disabled = true;
      btnText.innerText = "A processar na API...";

      try {
        // Payload estritamente limpo contendo apenas a URL para evitar qualquer erro de body inválido no Cobalt
        const payload = {
          url: videoUrl
        };

        const resposta = await fetch('https://cobalt-production-79c05f69.up.railway.app/', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!resposta.ok) {
          const erroJson = await resposta.json().catch(() => ({}));
          const mensagemErro = erroJson.error?.code || `Erro HTTP ${resposta.status}`;
          throw new Error(`Erro do servidor: ${mensagemErro}`);
        }

        const dados = await resposta.json();

        if (dados.status === 'redirect' || dados.status === 'tunnel' || dados.status === 'stream') {
          window.location.href = dados.url;
          btnText.innerText = "Baixar Novamente";
        } else if (dados.status === 'picker') {
          window.location.href = dados.picker[0].url;
          btnText.innerText = "Download Iniciado!";
        } else {
          exibirErro(dados.text || dados.message || "A API não conseguiu converter este vídeo.");
          btnText.innerText = "Tentar Novamente";
        }
      } catch (erro) {
        console.error("Erro na API:", erro);
        exibirErro(erro.message || "Erro de conexão com o serviço de download.");
        btnText.innerText = "Baixar Agora";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
